---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mandrivnyk91/Module-02
    targetRevision: HEAD
    path: ./den-demo
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true     
      selfHeal: true