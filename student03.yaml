---
apiVersion: v1
kind: Namespace
metadata:
  name: nsstudent03
  
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: student03
  namespace: nsstudent03

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: student03
  namespace: nsstudent03
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["*"]

---
apiVersion:    rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: student03
  namespace: nsstudent03
subjects:
- kind: ServiceAccount
  name: student03
  namespace: nsstudent03
roleRef:
  kind: Role 
  name: student03
  apiGroup: rbac.authorization.k8s.io
   
