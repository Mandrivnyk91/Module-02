apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-label-student
spec:
  background: false
  rules:
    - name: validate-readOnlyRootFilesystem
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - "nsstudent*"
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              +(person): student

