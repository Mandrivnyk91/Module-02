apiVersion: v1
kind: ConfigMap
metadata:
  name: student-monitoring-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  student-monitoring.json: |
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "advbnpp"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "builtIn": true,
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "query": {
                "datasource": {
                  "name": "-- Grafana --"
                },
                "group": "grafana",
                "kind": "DataQuery",
                "spec": {},
                "version": "v0"
              }
            }
          }
        ],
        "cursorSync": "Off",
        "editable": true,
        "elements": {
          "panel-1": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "sum by (namespace) (\r\n  rate(container_cpu_usage_seconds_total{\r\n    namespace=~\"$namespace\",\r\n    container!=\"\",\r\n    container!=\"POD\"\r\n  }[5m])\r\n)",
                            "legendFormat": "__auto",
                            "range": true
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "",
              "id": 1,
              "links": [],
              "title": "CPU Usage",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisBorderShow": false,
                        "axisCenteredZero": false,
                        "axisColorMode": "text",
                        "axisLabel": "",
                        "axisPlacement": "auto",
                        "barAlignment": 0,
                        "barWidthFactor": 0.6,
                        "drawStyle": "line",
                        "fillOpacity": 0,
                        "gradientMode": "none",
                        "hideFrom": {
                          "legend": false,
                          "tooltip": false,
                          "viz": false
                        },
                        "insertNulls": false,
                        "lineInterpolation": "linear",
                        "lineWidth": 1,
                        "pointSize": 5,
                        "scaleDistribution": {
                          "type": "linear"
                        },
                        "showPoints": "auto",
                        "showValues": false,
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "none"
                        },
                        "thresholdsStyle": {
                          "mode": "off"
                        }
                      },
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": 0
                          },
                          {
                            "color": "red",
                            "value": 80
                          }
                        ]
                      }
                    },
                    "overrides": []
                  },
                  "options": {
                    "legend": {
                      "calcs": [],
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "hideZeros": false,
                      "mode": "single",
                      "sort": "none"
                    }
                  }
                },
                "version": "13.3.0"
              }
            }
          },
          "panel-2": {
            "kind": "Panel",
            "spec": {
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "hidden": false,
                        "query": {
                          "datasource": {
                            "name": "prometheus"
                          },
                          "group": "prometheus",
                          "kind": "DataQuery",
                          "spec": {
                            "editorMode": "code",
                            "expr": "sum by (namespace) (\r\n  container_memory_working_set_bytes{\r\n    namespace=~\"$namespace\",\r\n    container!=\"\",\r\n    container!=\"POD\"\r\n  }\r\n) / 1024^3",
                            "legendFormat": "__auto",
                            "range": true
                          },
                          "version": "v0"
                        },
                        "refId": "A"
                      }
                    }
                  ],
                  "queryOptions": {},
                  "transformations": []
                }
              },
              "description": "",
              "id": 2,
              "links": [],
              "title": "Memory Usage",
              "vizConfig": {
                "group": "timeseries",
                "kind": "VizConfig",
                "spec": {
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisBorderShow": false,
                        "axisCenteredZero": false,
                        "axisColorMode": "text",
                        "axisLabel": "",
                        "axisPlacement": "auto",
                        "barAlignment": 0,
                        "barWidthFactor": 0.6,
                        "drawStyle": "line",
                        "fillOpacity": 0,
                        "gradientMode": "none",
                        "hideFrom": {
                          "legend": false,
                          "tooltip": false,
                          "viz": false
                        },
                        "insertNulls": false,
                        "lineInterpolation": "linear",
                        "lineWidth": 1,
                        "pointSize": 5,
                        "scaleDistribution": {
                          "type": "linear"
                        },
                        "showPoints": "auto",
                        "showValues": false,
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "none"
                        },
                        "thresholdsStyle": {
                          "mode": "off"
                        }
                      },
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green",
                            "value": 0
                          },
                          {
                            "color": "red",
                            "value": 80
                          }
                        ]
                      }
                    },
                    "overrides": []
                  },
                  "options": {
                    "legend": {
                      "calcs": [],
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "hideZeros": false,
                      "mode": "single",
                      "sort": "none"
                    }
                  }
                },
                "version": "13.3.0"
              }
            }
          }
        },
        "layout": {
          "kind": "AutoGridLayout",
          "spec": {
            "columnWidthMode": "standard",
            "items": [
              {
                "kind": "AutoGridLayoutItem",
                "spec": {
                  "element": {
                    "kind": "ElementReference",
                    "name": "panel-1"
                  }
                }
              },
              {
                "kind": "AutoGridLayoutItem",
                "spec": {
                  "element": {
                    "kind": "ElementReference",
                    "name": "panel-2"
                  }
                }
              }
            ],
            "maxColumnCount": 3,
            "rowHeightMode": "standard"
          }
        },
        "links": [],
        "liveNow": false,
        "preferences": {
          "layout": {
            "kind": "AutoGridLayout",
            "spec": {
              "columnWidthMode": "standard",
              "items": [],
              "maxColumnCount": 3,
              "rowHeightMode": "standard"
            }
          }
        },
        "preload": false,
        "tags": [],
        "timeSettings": {
          "autoRefresh": "",
          "autoRefreshIntervals": [
            "5s",
            "10s",
            "30s",
            "1m",
            "5m",
            "15m",
            "30m",
            "1h",
            "2h",
            "1d"
          ],
          "fiscalYearStartMonth": 0,
          "from": "now-6h",
          "hideTimepicker": false,
          "timezone": "browser",
          "to": "now"
        },
        "title": "Usage by Node",
        "variables": [
          {
            "kind": "QueryVariable",
            "spec": {
              "allowCustomValue": true,
              "current": {
                "text": [
                  "nsstudent01",
                  "nsstudent02",
                  "nsstudent03"
                ],
                "value": [
                  "nsstudent01",
                  "nsstudent02",
                  "nsstudent03"
                ]
              },
              "definition": "label_values(kube_pod_info{namespace=~\"nsstudent01|nsstudent02|nsstudent03\"},namespace)",
              "hide": "dontHide",
              "includeAll": false,
              "multi": true,
              "name": "namespace",
              "options": [],
              "query": {
                "datasource": {
                  "name": "prometheus"
                },
                "group": "prometheus",
                "kind": "DataQuery",
                "spec": {
                  "qryType": 1,
                  "query": "label_values(kube_pod_info{namespace=~\"nsstudent01|nsstudent02|nsstudent03\"},namespace)",
                  "refId": "PrometheusVariableQueryEditor-VariableQuery"
                },
                "version": "v0"
              },
              "refresh": "onDashboardLoad",
              "regex": "",
              "regexApplyTo": "text",
              "skipUrlSync": false,
              "sort": "disabled"
            }
          }
        ]
      }
    }