---
apiVersion: v1
kind: Namespace
metadata:
  name: nsstudent01
  
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: student01
  namespace: nsstudent01

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: student01
  namespace: nsstudent01
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["*"]

---
apiVersion:    rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: student01
  namespace: nsstudent01
subjects:
- kind: ServiceAccount
  name: student01
  namespace: nsstudent01
roleRef:
  kind: Role 
  name: student01
  apiGroup: rbac.authorization.k8s.io
   
